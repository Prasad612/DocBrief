apiVersion: v1
kind: Service
metadata:
  name: {{ include "DocBrief.fullname" . }}
  labels:
    {{- include "DocBrief.labels" . | nindent 4 }}
    app.kubernetes.io/component: docbrief
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "DocBrief.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: docbrief
    app.kubernetes.io/instance: {{ .Release.Name }}
