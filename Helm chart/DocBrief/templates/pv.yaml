apiVersion: v1
kind: PersistentVolume
metadata:
  name: databrief-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /home/rhel/helm/Prasad/test-project
    type: DirectoryOrCreate