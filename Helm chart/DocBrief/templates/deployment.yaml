apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "DocBrief.fullname" . }}
  labels:
    {{- include "DocBrief.labels" . | nindent 4 }}
    app.kubernetes.io/component: docbrief
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "DocBrief.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: docbrief
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- if .Values.rolloutNonce }}
        docbrief/rollout-nonce: {{ .Values.rolloutNonce | quote }}
        {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "DocBrief.labels" . | nindent 8 }}
        app.kubernetes.io/component: docbrief
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "DocBrief.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if gt (len .Values.volumeMounts) 0 }}
      initContainers:
        - name: init-myservice
          image: busybox
          command:
            - sh
            - -c
            - {{ printf "mkdir -p %s/logs" ((index .Values.volumeMounts 0).mountPath) | quote }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ include "DocBrief.name" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-config" (include "DocBrief.fullname" .) | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if gt (len .Values.volumeMounts) 0 }}
          command:
            - sh
            - -c
            - >-
              python -u main.py 2>&1 | tee -a {{ (index .Values.volumeMounts 0).mountPath }}/logs/app.log
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
