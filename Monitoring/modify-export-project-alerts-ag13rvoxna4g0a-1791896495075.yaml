apiVersion: 1
groups:
    - orgId: 1
      name: project-alerts
      folder: project
      interval: 30s
      rules:
        - uid: ag13rvoxna4g0a
          title: Project-Container-Restart
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: "sum by (pod) (\r\n  increase(\r\n    kube_pod_container_status_restarts_total{\r\n      namespace=\"deliver\"\r\n    }[5m]\r\n  )\r\n)"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          annotations:
            description: A container in the deliver namespace has restarted within the last 5 minutes. Check the affected pod and its logs.
            summary: Container restart detected in Deliver namespace
          labels: {}
          isPaused: false
